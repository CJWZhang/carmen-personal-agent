name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Match the tag to the package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Test and build release artifacts
        run: |
          python -m pip install --upgrade pip build ".[dev]"
          python -m pytest -q
          python -m carmen_agent.evals.runner
          python -m build
          python scripts/build-release-archive.py
          python scripts/verify-release.py dist/carmen-personal-agent-*-source.zip
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Carmen Personal Agent $GITHUB_REF_NAME"
