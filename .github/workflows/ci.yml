name: cross-platform tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base package and test dependencies
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m pytest -q
      - name: Frozen accuracy gate
        run: python -m carmen_agent.evals.runner

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check the public-file privacy boundary
        run: python scripts/build-release-archive.py --check-only
      - name: Build Python and sendable source artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python scripts/build-release-archive.py
          python scripts/verify-release.py dist/carmen-personal-agent-0.1.0-source.zip
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/carmen-smoke"
          "$RUNNER_TEMP/carmen-smoke/bin/python" -m pip install dist/carmen_personal_agent-*.whl
          CARMEN_HOME="$RUNNER_TEMP/carmen-home" "$RUNNER_TEMP/carmen-smoke/bin/carmen" init --name "Test User" --provider ollama
          CARMEN_HOME="$RUNNER_TEMP/carmen-home" "$RUNNER_TEMP/carmen-smoke/bin/carmen" --help
          CARMEN_HOME="$RUNNER_TEMP/carmen-home" "$RUNNER_TEMP/carmen-smoke/bin/carmen" ui --help
          "$RUNNER_TEMP/carmen-smoke/bin/python" -c "from carmen_agent.paths import COLLECTOR_SCHEMA_PATH; assert COLLECTOR_SCHEMA_PATH.is_file()"
          "$RUNNER_TEMP/carmen-smoke/bin/python" -c "from pathlib import Path; import carmen_agent; assert (Path(carmen_agent.__file__).parent / 'resources' / 'source-observation.schema.json').is_file()"
          "$RUNNER_TEMP/carmen-smoke/bin/python" -c "from pathlib import Path; import carmen_agent; assert list((Path(carmen_agent.__file__).parent / 'resources' / 'migrations').glob('*.sql'))"
          "$RUNNER_TEMP/carmen-smoke/bin/python" -c "from pathlib import Path; import carmen_agent; root = Path(carmen_agent.__file__).parent / 'resources'; assert (root / 'LICENSE').is_file() and (root / 'NOTICE').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: carmen-package-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*-source.zip
            dist/*.sha256
